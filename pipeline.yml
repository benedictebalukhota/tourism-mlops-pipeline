name: Tourism MLOps Pipeline

# ---------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------
# - push to main  : runs the full pipeline on every code update
# - pull_request  : validates changes before they reach main
# - workflow_dispatch : allows a manual run from the Actions tab
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping runs from racing each other when pushing to the
# same Hugging Face repositories.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  # -------------------------------------------------------------------
  # STAGE 1: Register the raw dataset on the Hugging Face dataset space
  # -------------------------------------------------------------------
  data-registration:
    name: Data Registration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register raw dataset on Hugging Face
        run: python tourism_project/data/data_register.py

  # -------------------------------------------------------------------
  # STAGE 2: Clean, split, and upload train/test data
  # -------------------------------------------------------------------
  data-preparation:
    name: Data Preparation
    runs-on: ubuntu-latest
    needs: data-registration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare and upload train/test splits
        run: python tourism_project/model_building/prep.py

  # -------------------------------------------------------------------
  # STAGE 3: Tune, track, evaluate, and register the model
  # -------------------------------------------------------------------
  model-training:
    name: Model Building and Registration
    runs-on: ubuntu-latest
    needs: data-preparation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train, track with MLflow, and register best model
        run: python tourism_project/model_building/train.py

      # Keep the MLflow run data and model artifact downloadable from the
      # Actions run page for auditing and for the project write-up.
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            tourism_project/model_building/artifacts/
            mlruns/
          retention-days: 14
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # STAGE 4: Push the Streamlit app to the Hugging Face Space
  # -------------------------------------------------------------------
  deployment:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: model-training
    # Only deploy from main - pull requests run the earlier stages only.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Push deployment files to Hugging Face Space
        run: python tourism_project/deployment/hosting.py

      - name: Report deployment URL
        run: |
          echo "### Deployment complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "App: https://huggingface.co/spaces/${HF_USERNAME}/tourism-wellness-app" >> $GITHUB_STEP_SUMMARY
          echo "Model: https://huggingface.co/${HF_USERNAME}/tourism-wellness-model" >> $GITHUB_STEP_SUMMARY
